# Work branches for the native screens (native/**): the same checks as a main build (LogNative
# package tests, simulator build and screenshots), in soft mode. The summary says NATIVE-CHECK:
# PASS or FAIL, but these runs never fail, so work in progress sends no failure emails. No .ipa is built here; that happens on main.
# iOS jobs use the same runner choice as the .ipa workflow (mac-mini, unless IOS_RUNNER=hosted).
name: Native work branches

# native/** pushes now run the full iPhone app workflow (ios-ipa.yml: simulator check
# and an .ipa), so this soft check only runs when started by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick-runner:
    name: Pick runner
    uses: ./.github/workflows/pick-runner.yml
    with:
      event_name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}
      head_repository: ${{ github.event.pull_request.head.repo.full_name || '' }}
      ios_runner: ${{ vars.IOS_RUNNER }}

  ios:
    needs: pick-runner
    uses: ./.github/workflows/ios-check.yml
    with:
      soft: true
      runs_on: ${{ needs.pick-runner.outputs.runs_on }}
