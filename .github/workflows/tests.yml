# Browser tests for the app's files (ios-app/www) on made-up data (tests/fixture.js).
# Runs on its own for app or test changes, and before every iPhone app build.
name: Tests

on:
  workflow_call:
    inputs:
      # Work branches: report a failure in the log and summary without failing the run.
      soft:
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "ios-app/www/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Bundled copy matches ios-app/www
        continue-on-error: ${{ inputs.soft == true }}
        run: diff -r --exclude=cordova.js --exclude=cordova_plugins.js ios-app/www ios-app/ios/App/App/public

      - name: Run tests
        id: run
        continue-on-error: ${{ inputs.soft == true }}
        working-directory: tests
        run: npm test

      - name: Result
        if: always()
        run: |
          echo "WEB-TESTS: ${{ steps.run.outcome }}"
          echo "### WEB-TESTS: ${{ steps.run.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: tests/shots
          retention-days: 7
