# Chooses where iOS jobs run.
# Trusted: push to main, native/**, or cursor/**; workflow_dispatch; a pull request whose
# head repository is this one. Fork pull requests stay on macos-15. pull_request_target is
# never trusted (do not run that event on a self-hosted runner).
# Lists runners with GITHUB_TOKEN (GET /repos/pranaybop/health-log/actions/runners) and
# picks the mac-mini only when a runner is online with all four labels: self-hosted,
# macOS, ARM64, mac-mini. If the token cannot list runners, or the mini is offline, the
# choice is the JSON string "macos-15".
name: Pick runner

on:
  workflow_call:
    inputs:
      event_name:
        description: github.event_name from the caller
        type: string
        required: true
      ref:
        description: github.ref from the caller
        type: string
        required: true
      repository:
        description: github.repository from the caller
        type: string
        required: true
      head_repository:
        description: pull request head repo, empty unless this is a pull_request
        type: string
        default: ""
    outputs:
      runs_on:
        description: JSON value for runs-on
        value: ${{ jobs.pick.outputs.runs_on }}

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs_on: ${{ steps.choose.outputs.runs_on }}
    steps:
      - name: Choose runner
        id: choose
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PICK_EVENT: ${{ inputs.event_name }}
          PICK_REF: ${{ inputs.ref }}
          PICK_REPOSITORY: ${{ inputs.repository }}
          PICK_HEAD_REPOSITORY: ${{ inputs.head_repository }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.error, urllib.request

          HOSTED = '"macos-15"'
          MINI = '["self-hosted","macOS","ARM64","mac-mini"]'
          REQUIRED = {"self-hosted", "macOS", "ARM64", "mac-mini"}
          REPO = "pranaybop/health-log"

          def trusted():
              repository = os.environ.get("PICK_REPOSITORY", "")
              if repository != REPO:
                  return False, "workflow is not running in pranaybop/health-log"
              event = os.environ.get("PICK_EVENT", "")
              ref = os.environ.get("PICK_REF", "")
              print("event=%s ref=%s repository=%s head=%s" % (event, ref, repository, os.environ.get("PICK_HEAD_REPOSITORY", "")))
              if event == "pull_request_target":
                  return False, "pull_request_target never uses the self-hosted runner"
              if event == "workflow_dispatch":
                  return True, "workflow_dispatch"
              if event == "push":
                  branch = ref[len("refs/heads/"):] if ref.startswith("refs/heads/") else ""
                  if branch == "main" or branch.startswith("native/") or branch.startswith("cursor/"):
                      return True, "push to " + (branch or ref)
                  return False, "push to " + (branch or ref) + " is not a trusted branch"
              if event == "pull_request":
                  full = os.environ.get("PICK_HEAD_REPOSITORY", "")
                  if full == repository:
                      return True, "pull request from this repository"
                  return False, "fork pull request stays on macos-15"
              return False, "event " + (event or "unknown") + " is not trusted"

          def fetch_runners(token):
              runners = []
              page = 1
              while page <= 10:
                  url = "https://api.github.com/repos/" + REPO + "/actions/runners?per_page=100&page=" + str(page)
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": "Bearer " + token,
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "health-log-pick-runner",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          data = json.load(resp)
                  except urllib.error.HTTPError as err:
                      raw = err.read().decode("utf-8", "replace")
                      try:
                          message = json.loads(raw).get("message", raw[:300])
                      except Exception:
                          message = raw[:300]
                      message = " ".join(str(message).split())[:300]
                      return err.code, message, []
                  except Exception as err:
                      return 0, err.__class__.__name__ + ": " + str(err), []
                  batch = data.get("runners") or []
                  runners.extend(batch)
                  total = data.get("total_count")
                  if not batch or (total is not None and len(runners) >= int(total)):
                      return 200, "", runners
                  page += 1
              return 200, "", runners

          def online_mini(runners):
              matches = []
              for runner in runners:
                  labels = [item.get("name", "") for item in (runner.get("labels") or []) if isinstance(item, dict)]
                  print("runner %s status=%s busy=%s labels=%s" % (runner.get("name"), runner.get("status"), runner.get("busy"), ",".join(labels)))
                  if runner.get("status") == "online" and REQUIRED <= set(labels):
                      matches.append(runner)
              for runner in matches:
                  if runner.get("name") == "pranay-mac-mini":
                      return runner
              return matches[0] if matches else None

          ok, why = trusted()
          choice = HOSTED
          if not ok:
              reason = "Untrusted: " + why + ". Using macos-15."
          else:
              token = os.environ.get("GITHUB_TOKEN") or ""
              if not token:
                  reason = "GITHUB_TOKEN is empty. Using macos-15."
              else:
                  code, message, runners = fetch_runners(token)
                  print("Runner API HTTP %s" % code)
                  if code in (401, 403) and "rate limit" not in message.lower():
                      reason = "GITHUB_TOKEN cannot list self-hosted runners (HTTP %s: %s). Using macos-15." % (code, message)
                      print("::notice::GITHUB_TOKEN cannot list self-hosted runners; iOS jobs will use macos-15.")
                  elif code != 200:
                      reason = "Runner list failed (HTTP %s: %s). Using macos-15." % (code, message)
                  else:
                      picked = online_mini(runners)
                      if picked:
                          choice = MINI
                          reason = "Runner %s is online with self-hosted, macOS, ARM64, and mac-mini. Using the mac-mini." % picked.get("name")
                      else:
                          described = "; ".join("%s=%s" % (item.get("name"), item.get("status")) for item in runners) or "no runners"
                          reason = "No online runner has all four labels (%s). Using macos-15." % described
          print(reason)
          print("RUNNER-CHOICE: " + choice)
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a") as handle:
                  handle.write("runs_on=" + choice + "\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as handle:
                  handle.write("### Runner\n\n" + reason + "\n\n`" + choice + "`\n")
          PY
