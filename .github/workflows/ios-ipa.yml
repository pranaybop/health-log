# Builds the Log iPhone app on a Mac runner and saves an unsigned .ipa, named with its
# version and build number (Log-1.1-12.ipa). The app's files are bundled from ios-app/www.
# Install it with Sideloadly or AltStore, which sign it with your Apple ID.
# No secrets or certificates are used or needed here.
name: iPhone app (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**", "native/**"]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  pick-runner:
    name: Pick runner
    uses: ./.github/workflows/pick-runner.yml
    with:
      event_name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      repository: ${{ github.repository }}
      head_repository: ${{ github.event.pull_request.head.repo.full_name || '' }}
      ios_runner: ${{ vars.IOS_RUNNER }}

  build:
    needs: [test, pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on) }}
    # Applies on the mini and on macos-15, so a stuck device build cannot run forever.
    timeout-minutes: 30
    # No concurrency group: the mini is one runner, so it already runs one job at a time,
    # and a group would cancel a waiting build whenever another job queued behind it.
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass needs the iOS 26 SDK: use the newest Xcode 26 on GitHub-hosted runners.
      # The mini already has Xcode 27.2 selected, so skip sudo xcode-select there.
      - name: Pick Xcode
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          ls -d /Applications/Xcode*.app || true
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            xcodebuild -version
          else
            X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
            if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
            xcodebuild -version
          fi

      # Version: ios-app/VERSION (bump it for a release you want to tell apart), build: this
      # workflow's run number, which goes up by one every build.
      - name: Version
        run: |
          echo "APP_VERSION=$(tr -d '[:space:]' < ios-app/VERSION)" >> "$GITHUB_ENV"
          echo "APP_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      # The app runs from files inside the .ipa (ios-app/www), not from the website.
      - name: Bundle the app files
        run: |
          sh ios-app/sync-web.sh
          SHA=$(git rev-parse --short HEAD)
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf 'window.LOG_VERSION = { version: "%s", build: %s, commit: "%s", built: "%s" };\n' "$APP_VERSION" "$APP_BUILD" "$SHA" "$BUILT" > ios-app/ios/App/App/public/version.js
          cat ios-app/ios/App/App/public/version.js
          test -f ios-app/ios/App/App/public/app.js

      - name: Build (Release, device, unsigned)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            build

      - name: Package the .ipa
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist"
          test -f "$APP/public/app.js"
          IPA="Log-$APP_VERSION-$APP_BUILD.ipa"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          # Carry the HealthKit entitlement in the binary so the signing tool asks for it.
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ] && [ -x /opt/homebrew/bin/brew ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          if brew install ldid >/dev/null 2>&1; then
            ldid -S"ios-app/ios/App/App/App.entitlements" "$RUNNER_TEMP/ipa/Payload/App.app/App" && echo "entitlements embedded"
          else
            echo "ldid unavailable; entitlements not embedded"
          fi
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$IPA" Payload)
          ls -lh "$IPA"
          echo "### Log $APP_VERSION (build $APP_BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Log-${{ env.APP_VERSION }}-build-${{ env.APP_BUILD }}
          path: ${{ env.IPA }}
          retention-days: 30

      - name: Clean up the self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        run: |
          xcrun simctl shutdown booted || true
          if [ -n "$RUNNER_TEMP" ]; then
            rm -rf "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/sim" "$RUNNER_TEMP/dd" "$RUNNER_TEMP/ipa"
          fi

  # A debug copy in the iPhone simulator on made-up data: package tests, tabs, screenshots.
  simulator:
    needs: [test, pick-runner]
    uses: ./.github/workflows/ios-check.yml
    with:
      runs_on: ${{ needs.pick-runner.outputs.runs_on }}
