# Builds the Log iPhone app on GitHub's Mac runners and saves an unsigned .ipa, named with its
# version and build number (Log-1.1-12.ipa). The app's files are bundled from ios-app/www.
# Install it with Sideloadly or AltStore, which sign it with your Apple ID.
# No secrets or certificates are used or needed here.
name: iPhone app (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass needs the iOS 26 SDK: use the newest Xcode 26 on the runner if it has one.
      - name: Pick Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      # Version: ios-app/VERSION (bump it for a release you want to tell apart), build: this
      # workflow's run number, which goes up by one every build.
      - name: Version
        run: |
          echo "APP_VERSION=$(tr -d '[:space:]' < ios-app/VERSION)" >> "$GITHUB_ENV"
          echo "APP_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      # The app runs from files inside the .ipa (ios-app/www), not from the website.
      - name: Bundle the app files
        run: |
          sh ios-app/sync-web.sh
          SHA=$(git rev-parse --short HEAD)
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf 'window.LOG_VERSION = { version: "%s", build: %s, commit: "%s", built: "%s" };\n' "$APP_VERSION" "$APP_BUILD" "$SHA" "$BUILT" > ios-app/ios/App/App/public/version.js
          cat ios-app/ios/App/App/public/version.js
          test -f ios-app/ios/App/App/public/app.js

      - name: Build (Release, device, unsigned)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            build

      - name: Package the .ipa
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist"
          test -f "$APP/public/app.js"
          IPA="Log-$APP_VERSION-$APP_BUILD.ipa"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          # Carry the HealthKit entitlement in the binary so the signing tool asks for it.
          if brew install ldid >/dev/null 2>&1; then
            ldid -S"ios-app/ios/App/App/App.entitlements" "$RUNNER_TEMP/ipa/Payload/App.app/App" && echo "entitlements embedded"
          else
            echo "ldid unavailable; entitlements not embedded"
          fi
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$IPA" Payload)
          ls -lh "$IPA"
          echo "### Log $APP_VERSION (build $APP_BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Log-${{ env.APP_VERSION }}-build-${{ env.APP_BUILD }}
          path: ${{ env.IPA }}
          retention-days: 30

  # Runs a debug copy in the iPhone simulator on made-up data (tests/fixture.js) and checks it
  # starts, loads and switches tabs without errors. Screenshots are printed into the log as
  # base64 JPEG lines (IMGDATA <name> ...) so they can be read without downloading artifacts.
  simulator:
    needs: test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Bundle the app files and the demo data
        run: |
          sh ios-app/sync-web.sh
          node -e 'process.stdout.write(JSON.stringify(require("./tests/fixture").makeFixture()))' > ios-app/ios/App/App/public/demo.json
          ls -la ios-app/ios/App/App/public/demo.json

      - name: Build for the simulator (Debug)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" \
            CODE_SIGNING_ALLOWED=NO build | tail -5

      - name: Run it and take screenshots
        run: |
          set -e
          APP="$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          best = None
          for rt, devs in json.load(sys.stdin)["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for d in devs:
                  n = d["name"]
                  if not n.startswith("iPhone") or "Max" in n or "Plus" in n or "SE" in n:
                      continue
                  score = (ver, "Pro" in n)
                  if best is None or score > best[0]:
                      best = (score, d["udid"], n, rt)
          print(best[1])
          print("Simulator:", best[2], best[3], file=sys.stderr)
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          fail=0
          shoot() {
            name=$1; tab=$2; look=$3
            xcrun simctl ui "$UDID" appearance "$look"
            xcrun simctl terminate "$UDID" com.pranaybop.log 2>/dev/null || true
            xcrun simctl launch --console-pty "$UDID" com.pranaybop.log -demo "$tab" > "$RUNNER_TEMP/$name.log" 2>&1 &
            sleep 16
            if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "com.pranaybop.log"; then
              echo "::error::$name: the app isn't running (crashed?)"; fail=1
            fi
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/$name.png" >/dev/null
            sips -s format jpeg -s formatOptions 60 --resampleWidth 560 "$RUNNER_TEMP/$name.png" --out "$RUNNER_TEMP/$name.jpg" >/dev/null
            echo "::group::console $name"; grep -v "^$" "$RUNNER_TEMP/$name.log" | tail -40 || true; echo "::endgroup::"
            if grep -E "\[error\].*(ReferenceError|TypeError|SyntaxError)|Unhandled Promise" "$RUNNER_TEMP/$name.log"; then
              echo "::error::$name: script error in the page"; fail=1
            fi
            base64 -i "$RUNNER_TEMP/$name.jpg" | tr -d '\n' | fold -w 4000 | sed "s/^/IMGDATA $name /"
            echo
          }
          # Warm up once: the first launch on a fresh simulator is slow.
          xcrun simctl launch "$UDID" com.pranaybop.log -demo today >/dev/null; sleep 25; xcrun simctl terminate "$UDID" com.pranaybop.log || true
          shoot today-light today light
          shoot trends-light trends light
          shoot trends-dark trends dark
          shoot meds-dark meds dark
          shoot log-light log light
          exit $fail
